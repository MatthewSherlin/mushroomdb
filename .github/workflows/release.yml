# Tag-gated. Pushing a v* tag builds three-platform binaries, a GitHub Release,
# GHCR images, and (when tokens/OIDC exist) npm / PyPI. crates.io is referenced
# but not published until workspace path deps gain version= keys.
#
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: binary-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-apple-darwin dropped in v0.1.1: hosted macos-13 runners are
          # chronically starved (v0.1.0 job sat queued past the 24h cap twice).
          # Intel macOS users build from source; the formula is arm64-only on macOS.
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p mushroomdb-cli --bin mushroomdb --features embed-ui --release --target ${{ matrix.target }}
      - name: pack tarball + sha256
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          ASSET="mushroomdb-${TAG}-${TARGET}.tar.gz"
          BIN="target/${TARGET}/release/mushroomdb"
          test -f "$BIN"
          chmod +x "$BIN"
          if command -v strip >/dev/null 2>&1; then strip "$BIN" || true; fi
          STAGE=$(mktemp -d)
          cp "$BIN" "${STAGE}/mushroomdb"
          tar -C "$STAGE" -czf "$ASSET" mushroomdb
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi
          mkdir -p dist
          mv "$ASSET" "${ASSET}.sha256" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS + Homebrew formula
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort > dist/SHA256SUMS
          cat dist/SHA256SUMS
          VER="${GITHUB_REF_NAME#v}"
          sh packaging/homebrew/render.sh "$VER" dist/SHA256SUMS dist/mushroomdb.rb
          echo "generated formula:"
          cat dist/mushroomdb.rb
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/mushroomdb.rb
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image owner
        id: img
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/mushroomdb:latest
            ghcr.io/${{ steps.img.outputs.owner }}/mushroomdb:${{ github.ref_name }}

  # Registry publishing lives in publish.yml (OIDC Trusted Publishing).
  # Its `release: published` trigger never fires for releases created with
  # GITHUB_TOKEN (GitHub suppresses GITHUB_TOKEN-caused events), so the
  # v0.2.0 release shipped binaries but silently skipped every registry —
  # dispatch publish.yml explicitly instead (workflow_dispatch IS allowed
  # from GITHUB_TOKEN).
  trigger-publish:
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: dispatch publish.yml on this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

# publish.yml — Registry publishing via OIDC Trusted Publishing
#
# Triggered on GitHub Release "published" event (or manually).
# Publishes to crates.io, PyPI, and npm in parallel after building.
# NO secrets required for crates.io or PyPI — both use OIDC.
# npm requires a granular token (see bootstrap notes below).
#
# ─── HUMAN SETUP REQUIRED BEFORE FIRST RUN ───────────────────────────────────
#
# CRATES.IO (Trusted Publishing — no token):
#   1. Go to https://crates.io and log in.
#   2. For each crate name below, if it does not yet exist, you MUST publish
#      it manually the FIRST time (see bootstrap section), OR create the crate
#      entry by clicking "publish new crate" and registering the name.
#   3. For each published crate, open its crates.io settings and add a
#      Trusted Publisher:
#        - Repository owner: MatthewSherlin
#        - Repository name: mushroomdb
#        - Workflow filename: publish.yml
#      Do this for: mushroomdb-storage, mushroomdb-rules, mushroomdb-query,
#        mushroomdb, mushroomdb-arrow, mushroomdb-server, mushroomdb-extract,
#        mushroomdb-cli
#   FIRST-PUBLISH BOOTSTRAP: crates.io Trusted Publishing requires the crate
#   to already exist on the registry before a trusted publisher can be added.
#   Bootstrap via: cargo login <your-api-token> && cargo publish -p <crate>
#   (publishing once with a token, then switching to Trusted Publishing for all
#   subsequent releases). Publish in dependency order:
#     mushroomdb-storage → mushroomdb-rules → mushroomdb-query → mushroomdb
#     → mushroomdb-arrow → mushroomdb-server → mushroomdb-extract
#     → mushroomdb-cli
#   Wait ~30 seconds between each publish for the index to update.
#
# PYPI (Trusted Publishing — no token):
#   1. Go to https://pypi.org and log in.
#   2. Navigate to Publishing > "Add a new pending publisher".
#   3. Fill in:
#        PyPI project name: mushroomdb
#        Owner: MatthewSherlin
#        Repository name: mushroomdb
#        Workflow name: publish.yml
#        Environment name: pypi  (or leave blank — must match the `environment:` below)
#   FIRST-PUBLISH BOOTSTRAP: PyPI Trusted Publishing supports "pending publishers"
#   so you can configure it BEFORE the first publish — no prior token publish
#   needed. Just configure the pending publisher and the first push via this
#   workflow will create the project automatically.
#
# NPM (Granular Token — token required):
#   npm does not currently support fully-tokenless OIDC publishing in the same
#   model as PyPI. npm provenance (--provenance flag) attaches a Sigstore
#   signature but still requires an npm auth token for the publish itself.
#   1. Go to https://www.npmjs.com → Account → Access Tokens → Generate Token
#      → Granular Access Token.
#   2. Select permissions: Read and Write for packages "mushroomdb" and
#      "mushroomdb-client".
#   3. Set expiration as appropriate (or "No expiration" for a CI automation token).
#   4. Add the token as a GitHub Actions secret named NPM_TOKEN in
#      Settings → Secrets and variables → Actions.
#   FIRST-PUBLISH BOOTSTRAP for mushroomdb (packaging/npm):
#     npm does not allow publishing a scoped public package without first
#     existing. Run once manually: cd packaging/npm && npm publish --access public
#   FIRST-PUBLISH BOOTSTRAP for mushroomdb-client (clients/typescript):
#     Build first: npm ci && npm run build
#     Then: npm publish --access public
# ──────────────────────────────────────────────────────────────────────────────

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── crates.io ──────────────────────────────────────────────────────────────
  # Publishes in strict dependency order. Each step waits ~30 s for the index
  # to propagate before the next crate is submitted.
  publish-crates:
    name: crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with:
          toolchain: "1.92.0"

      # Authenticate to crates.io via OIDC (no CARGO_REGISTRY_TOKEN secret needed).
      # Setup: crates.io → crate settings → Trusted Publishers → Add publisher
      #   repo=MatthewSherlin/mushroomdb workflow=publish.yml
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth

      # The auth action only OUTPUTS the token — cargo reads CARGO_REGISTRY_TOKEN.
      # Without this export every publish step fails with "no token found"
      # (bug found live on the v0.2.0 publish run).
      - name: export registry token for cargo
        run: echo "CARGO_REGISTRY_TOKEN=${{ steps.crates-auth.outputs.token }}" >> "$GITHUB_ENV"

      # Idempotent ordered publish: a re-run after a partial failure skips
      # crates already on the index instead of dying on "already exists"
      # (lesson from the v0.2.0 release: run 33262706595 published 3 of 7,
      # then failed; a naive re-run would have died on crate 1).
      - name: publish crates in dependency order (idempotent)
        run: |
          set -u
          for c in mushroomdb-storage mushroomdb-rules mushroomdb-query \
                   mushroomdb mushroomdb-arrow mushroomdb-server \
                   mushroomdb-extract mushroomdb-cli; do
            echo "── publishing $c ──"
            if out=$(cargo publish -p "$c" 2>&1); then
              echo "$out" | tail -3
            else
              echo "$out"
              if echo "$out" | grep -q "already exists\|already uploaded"; then
                echo "$c: this version is already on the index — skipping"
              else
                exit 1
              fi
            fi
            sleep 30
          done

  # ── PyPI ───────────────────────────────────────────────────────────────────
  # Builds wheels for four targets, then uploads via OIDC trusted publishing.
  # No PyPI token secret needed — configure a pending publisher on PyPI first.
  publish-pypi:
    name: PyPI
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/mushroomdb

    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            maturin-target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin-target: aarch64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with:
          toolchain: "1.92.0"

      # macOS runners don't ship every CPython we target — install them so
      # maturin's -i list resolves (Linux builds get them from the manylinux
      # container's /opt/python instead).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: startsWith(matrix.os, 'macos')
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      # Build one abi3 wheel per platform (pyo3 abi3-py310 → a single wheel
      # covers CPython ≥3.10). This sidesteps the aarch64 manylinux failure
      # where a per-version interpreter list ("-i 3.10 3.11 …") couldn't be
      # resolved inside the container (v0.2.0 publish, run 33262876469):
      # abi3 needs only ONE interpreter, which every container ships.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist -i 3.10
          working-directory: bindings/python
          target: ${{ matrix.maturin-target }}
          # Use manylinux container on Linux for broad compatibility.
          manylinux: ${{ startsWith(matrix.os, 'ubuntu') && 'auto' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  publish-pypi-upload:
    name: PyPI upload
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mushroomdb

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # Upload via OIDC — no PyPI token needed.
      # Setup: pypi.org → Publishing → Add pending publisher
      #   project=mushroomdb owner=MatthewSherlin repo=mushroomdb
      #   workflow=publish.yml environment=pypi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  # ── npm ────────────────────────────────────────────────────────────────────
  # Publishes both npm packages with provenance attestation.
  # NPM_TOKEN secret is required (see human-setup notes at the top of this file).
  publish-npm-launcher:
    name: npm (mushroomdb launcher)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for --provenance
    outputs:
      # The version actually published (or already on the registry), read
      # from the mutated package.json rather than recomputed from the ref —
      # smoke-npx needs the exact string npm has, not a guess at it.
      version: ${{ steps.publish.outputs.version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Only rewrite the version when the ref IS a version tag; a
      # workflow_dispatch from main gets "main" here, which npm rejects
      # (v0.2.0 publish failure) — the committed package.json version is
      # already correct in that case.
      - name: set version from tag
        working-directory: packaging/npm
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          else
            echo "ref '$GITHUB_REF_NAME' is not a version tag — keeping package.json version"
          fi

      # --provenance attaches a Sigstore attestation (requires id-token: write).
      # NODE_AUTH_TOKEN is the npm granular token from the NPM_TOKEN secret.
      # Skip if this exact version is already on the registry (idempotent re-runs).
      - name: npm publish mushroomdb
        id: publish
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if npm view "mushroomdb@$VER" version >/dev/null 2>&1; then
            echo "mushroomdb@$VER already published — skipping"
          else
            npm publish --provenance --access public
          fi

  # Post-publish smoke test: the exact path a new user takes. `npx` fetches
  # the just-published package into a clean HOME, `install` writes an
  # .mcp.json pinned to it, and the SDK handshake script spawns that pinned
  # `npx` command for real — so a break anywhere in the published artifact
  # (missing bin, bad shebang, a launcher that can't find the native binary)
  # fails the release, not a user.
  smoke-npx:
    name: npx smoke test
    needs: [publish-npm-launcher]
    if: ${{ needs.publish-npm-launcher.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: install handshake script deps
        working-directory: scripts/mcp-handshake
        run: npm ci

      - name: wait for the published version to propagate on npm
        env:
          VER: ${{ needs.publish-npm-launcher.outputs.version }}
        run: |
          set -euxo pipefail
          for i in $(seq 1 45); do
            if npm view "mushroomdb@$VER" version >/dev/null 2>&1; then
              echo "mushroomdb@$VER is live on npm"
              exit 0
            fi
            echo "waiting for mushroomdb@$VER to propagate ($i/45)…"
            sleep 20
          done
          echo "mushroomdb@$VER did not appear on the npm registry within 15 minutes" >&2
          exit 1

      - name: npx install into a fresh project, then SDK handshake against it
        env:
          VER: ${{ needs.publish-npm-launcher.outputs.version }}
        run: |
          set -euxo pipefail

          # Clean HOME: no pre-warmed npx cache, no pre-existing npm config —
          # this is a first-time user's environment, not the CI runner's.
          HOME="$(mktemp -d)"
          export HOME

          REPO="$(mktemp -d)"
          cd "$REPO"
          git init -q
          git -c user.name=smoke -c user.email=smoke@example.test \
            commit -q --allow-empty -m "smoke test project"

          npx -y "mushroomdb@$VER" install --project --platform claude-code --no-git-hooks

          test -f .mcp.json
          command=$(jq -r '.mcpServers.mushroomdb.command' .mcp.json)
          arg0=$(jq -r '.mcpServers.mushroomdb.args[0]' .mcp.json)
          arg1=$(jq -r '.mcpServers.mushroomdb.args[1]' .mcp.json)
          arg2=$(jq -r '.mcpServers.mushroomdb.args[2]' .mcp.json)
          arg3=$(jq -r '.mcpServers.mushroomdb.args[3]' .mcp.json)
          test "$command" = "npx"
          test "$arg0" = "-y"
          test "$arg1" = "mushroomdb@$VER"
          test "$arg2" = "mcp"
          case "$arg3" in
            /*/mushroom-memory) : ;;
            *)
              echo "unexpected db path in .mcp.json args[3]: $arg3" >&2
              exit 1
              ;;
          esac

          OUT=$(node "$GITHUB_WORKSPACE/scripts/mcp-handshake/handshake.mjs" \
            --config .mcp.json --server mushroomdb \
            --expect-version "$VER" \
            --expect-tools map,context,why \
            --call why '{"a":"nope1","b":"nope2"}')
          echo "$OUT"
          echo "$OUT" | grep -q "unknown:"

  publish-npm-client:
    name: npm (mushroomdb-client)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for --provenance

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: install + build
        working-directory: clients/typescript
        run: |
          npm ci
          npm run build

      # Same tag-guard + idempotency as the launcher job above.
      - name: set version from tag
        working-directory: clients/typescript
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          else
            echo "ref '$GITHUB_REF_NAME' is not a version tag — keeping package.json version"
          fi

      - name: npm publish mushroomdb-client
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "mushroomdb-client@$VER" version >/dev/null 2>&1; then
            echo "mushroomdb-client@$VER already published — skipping"
          else
            npm publish --provenance --access public
          fi

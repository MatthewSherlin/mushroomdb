name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0", components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --workspace --examples
      - run: cargo test --workspace
      # The openCypher TCK gate (0.10 QL-10). `cargo test --workspace` above
      # already ran `tck-runner`'s `test_tck_gate`, which fails when the pass
      # rate falls below tck-baseline.txt. This step runs the TCK once more to
      # print the rate, and says so when it rose: CI never writes the baseline
      # or pushes; it is raised by an ordinary change. A step of this job, not
      # a job of its own, to stay inside the workflow's concurrent-job limit
      # (the whole run takes seconds and reuses this job's build).
      - run: cargo run -p tck-runner -- --check
        timeout-minutes: 10
      # The generated Cypher function table (docs/site/conformance-functions.md)
      # is checked against a fresh TCK run on the build above; a change that moves
      # a TCK result regenerates it with `bash scripts/gen-conformance-table.sh`.
      # A step, not a job, for the same reason (PS-6).
      - run: bash scripts/gen-conformance-table.sh --check
        timeout-minutes: 10
      - run: bash scripts/tests/test_gen_conformance_table.sh
      # The examples docs/site/rust.md quotes. `cargo build --workspace
      # --examples` above built them; running the binaries checks each one's
      # assertions without building anything again.
      - run: target/debug/examples/embed_basics
      - run: target/debug/examples/embed_batch
      - run: target/debug/examples/embed_shared
      # Counts #[ignore]d tests against how many any workflow actually names.
      # Exits 1 if a test is neither named in a workflow nor listed in
      # scripts/ignored-tests-allowed.txt. Added because 20 of 28 ran nowhere.
      - run: bash scripts/ignored-test-census.sh
      # Multi-process suite: spawns the `mp_worker` helper binary, which only
      # exists behind the `mp-test` feature (so a plain workspace test run never
      # builds it). Cross-process locking has no other coverage.
      - run: cargo test -p mushroomdb --features mp-test --test multiprocess
      # The published image is built with `--features tls`, so the TLS tests
      # (gated on the feature) run here. `tls_no_provider` is its own process
      # and installs no rustls crypto provider, as the shipped binary does not
      # (ledger row 141); the Bolt listener's TLS test runs beside it.
      - run: cargo test -p mushroomdb-server --features tls --test tls --test tls_no_provider
      - run: cargo test -p mushroomdb-bolt --features tls --test server
      - run: cargo clippy -p mushroomdb --all-targets --features mp-test -- -D warnings
      # Tests that need a hook that exists only behind `test-hooks` — a store
      # 0.8.0 left behind (ledger row 107), or a range index's postings read
      # directly (0.10 TY-8) — so a plain workspace run skips them. The
      # constraint tests no longer need it (0.10 TY-12) and run here as well.
      - run: cargo test -p mushroomdb --features test-hooks --test shared_edge_rules --test constraints --test range_index
      # Compile-only: CI runners are too noisy for timing gates.
      - run: cargo bench --no-run
      # The first minute on a new store, against the built binary. Every
      # assertion in it failed on v0.6.12; none may fail again silently. Kept
      # last in this job on purpose: a failure here must not strand the
      # multiprocess suite above, which has no other coverage.
      - run: cargo test -p mushroomdb-cli --test first_run
      # TODO: add a Miri job for crates/core-storage (MappedBase::topology/columns/
      # edge_props_section access_unchecked seams). These seams have no proptest
      # hostile-bytes coverage; Miri is the appropriate defence against corrupt
      # relative-pointer UB. Blocked on Miri's limited mmap support — track as
      # a separate job once mmap stubs land in the Miri tree.

  # Correctness gates that are #[ignore]'d out of `cargo test --workspace`
  # because they are slow, but are NOT timing-sensitive (they assert a recall
  # FLOOR, not wall-clock). Without this job the published HNSW recall numbers
  # are unguarded — a recall regression would pass CI. Measured at the 0.6.6
  # default shape (m=16, m0=64, ef_construction=200, ef_search=400, prune=both):
  # the uniform 5k gate is at min 1.0000 / mean 1.0000, the two clustered ones at
  # 1.0000, and the 40x120 fixture at min 0.8000 / mean 0.9950. Every wall clock
  # below is measured on the shipped f32 distance kernel; the job is roughly
  # 5 min on aarch64 and slower on this runner, whose baseline x86-64 has no FMA.
  # Timing gates (group-commit throughput, reader-burst p95) stay out of CI and
  # are covered by the median-of-3 bench-compare job instead.
  recall-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      # hnsw_5k_1536_recall: 5k vectors × 1536-D HNSW; asserts min recall@10 ≥ 0.90, mean ≥ 0.95.
      # Measured: min 1.0000 / mean 1.0000, ~46 s.
      - run: cargo test --release -p mushroomdb-rules -- hnsw_5k_1536_recall --ignored --nocapture
      # clustered_recall_survives_clusters_wider_than_m0: 40 clusters of 120 × 128-D, so a
      # cluster is wider than m0=64 — the case the diverse-neighbour prune replaced M₀=128
      # for. That prune is a first-rejection short-cut of HNSW §3.5, not §3.5 itself; see
      # docs/site/rules.md before "correcting" it toward the paper.
      # Runs both prune shapes and asserts each against its own floor plus both >= own:
      # own min 0.5000 / mean 0.9350 (floors 0.40/0.90), both min 0.8000 / mean 0.9950
      # (floors 0.70/0.95). ~3 s.
      - run: cargo test --release -p mushroomdb-rules -- clustered_recall_survives_clusters_wider_than_m0 --ignored --nocapture
      # recall_survives_insert_remove_churn: the same 5k × 1536-D corpus put through an
      # insert/remove/re-insert sequence, then scored against brute force over the
      # survivors. Asserts min recall@10 ≥ 0.90, mean ≥ 0.95 — a graph that heals badly
      # answers from the wrong neighbourhood, and nothing else in CI would notice.
      # Measured: min 1.0000 / mean 1.0000 over 3857 survivors, ~47 s.
      - run: cargo test --release -p mushroomdb-rules -- recall_survives_insert_remove_churn --ignored --nocapture
      # approximate_recall_above_floor_1536dim_1k: 1024-node HNSW × 1536-D; asserts recall ≥ 0.90.
      # ~9 s. Under HNSW_BUILD_BATCH, so create_rule still backfills inline here.
      - run: cargo test --release -p sim-harness -- approximate_recall_above_floor_1536dim_1k --ignored --nocapture
      # approximate_recall_5k_timing: 5k-node HNSW × 1536-D; asserts recall ≥ 0.90.
      # Measured: recall 1.0000 (495000/495000), backfill 49 s, ~70 s in total with the
      # O(n^2) ground truth. This is the one gate with a v0.6.5 number to compare against:
      # its backfill was 227 s there (see this file at tag v0.6.5), at the same recall.
      # 5000 vectors is over HNSW_BUILD_BATCH, so the test pumps
      # pump_index_build() to completion before measuring — without that it derives no
      # edges at all and scores 0.0000, which is how it sat dark through 0.6.6's Task 2.
      # At prune=own this gate fails at 0.8581; see docs/site/rules.md.
      - run: cargo test --release -p sim-harness -- approximate_recall_5k_timing --ignored --nocapture
      # dist_evals_5k_is_under_36000 / dist_evals_ratio_1k_to_5k_is_under_2_8x: counts
      # distance evaluations per insert at 1k and 5k (dimension 32 — the count is a
      # property of the graph, not of the dimension). A count, not a wall clock, so
      # it holds on any machine: this is the gate that notices the insert path doing
      # more work per vector as the index grows, which no timing-free test did
      # before. Split from one test (dist_evals_per_insert_is_bounded) into two so
      # a red absolute-ceiling assertion cannot hide the ratio assertion behind it —
      # named separately here so `cargo test`'s substring filter still runs both.
      # Measured 12,739.5 at 1k and 23,901.7 at 5k, ratio 1.876, against ceilings of
      # 36,000 and 2.8x. ~2 s.
      - run: cargo test --release -p mushroomdb-rules --features test-hooks -- dist_evals_5k_is_under_36000 dist_evals_ratio_1k_to_5k_is_under_2_8x --ignored --nocapture
      # exact_vector_rule_recall_5k: an exact VectorSimilar rule over the same
      # 5k × 1536-D corpus; asserts recall >= 0.98 against the same O(n^2)
      # ground truth the approximate gate uses. From 0.6.6 an exact rule finds its
      # candidates through the index too, so this gate is what holds the beam's
      # stopping rule honest. Like the approximate one it is over HNSW_BUILD_BATCH
      # and pumps the build to completion before measuring. Measured: recall
      # 1.0000 (495000/495000), creation 63 s, ~85 s in total; the same rule with
      # MUSHROOMDB_VECTOR_SCAN=1 takes 147 s to create and also scores 1.0000.
      - run: cargo test --release -p sim-harness -- exact_vector_rule_recall_5k --ignored --nocapture

  # The 0.10 concurrency gate (TX-7). Unlike the timing benches above, this one
  # runs on every push, because it is what holds the lock-free reader to its
  # promise: on a 10k-node store with a writer committing 50 times a second,
  # 16 concurrent neighbourhood reads keep p50 <= 0.5 ms and p99 <= 2 ms (one
  # re-measure is allowed; both must miss). It also holds the writer where the
  # owner accepted it on 2026-10-21. The v0.9.2 tag is built here with the same
  # scenario (--cfg mdb_v092) and run interleaved with this build on this
  # runner, so the bounds are against v0.9.2 on the same machine: a plain
  # commit within 1.15x v0.9.2's with readers paused (the 1.05x bar plus
  # noise) and 1.25x with them running (accepted 1.16-1.21x), within 1.5x its
  # own paused cost, while the readers complete >= 10k reads/s. Threads are
  # capped by the runner's cores, so a small runner times the code, not the
  # scheduler. Release only: the tests are #[ignore]d out of the debug run.
  concurrency-gate:
    runs-on: ubuntu-latest
    # A hung baseline child or writer loop must not hold a runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - name: build the v0.9.2 baseline
        run: |
          base="$RUNNER_TEMP/v092"
          mkdir -p "$base"
          git archive v0.9.2 | tar -x -C "$base"
          mkdir -p "$base/crates/core-bench/benches/shared" "$base/crates/core-bench/tests"
          cp crates/core-bench/benches/shared/concurrency.rs "$base/crates/core-bench/benches/shared/"
          cp crates/core-bench/tests/concurrency_gate.rs "$base/crates/core-bench/tests/"
          exe=$(cd "$base" && RUSTFLAGS="--cfg mdb_v092" cargo test --release -p core-bench \
            --test concurrency_gate --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "concurrency_gate") | .executable // empty' | tail -1)
          test -x "$exe"
          echo "MUSHROOMDB_GATE_V092=$exe" >> "$GITHUB_ENV"
      - run: cargo test --release -p core-bench --test concurrency_gate -- concurrency_gate --ignored --nocapture --exact
        timeout-minutes: 20
      # Ledger row 130's scaling pin: a create-edges-and-delete batch of 20k
      # rows within 8x one of 5k (linear is ~4x; the old quadratic 9-16x).
      - run: cargo test --release -p mushroomdb --test batch_vs_commits -- bench_create_edges_and_delete_batch_is_linear --ignored --nocapture

  # The official Python and JavaScript Bolt drivers, at pinned versions, run
  # the twelve scenarios of the 0.10 transactions spec (W3 section 6) against
  # the release binary: connect, a refused token, auto-commit reads and writes,
  # explicit and managed transactions, 1000 rows streamed 100 at a time, every
  # value type, a conflict the driver retries, db.labels() and a role token's
  # view, the routing scheme through ROUTE, and bookmarks across sessions.
  # One job, so the binary is built once and the workflow stays at 20
  # concurrent runs; each driver is its own step, and the second runs even
  # when the first fails. tests/bolt/run_compat.sh starts the server on
  # loopback with a token, waits for /ready, and stops it afterwards.
  bolt-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: cargo build -p mushroomdb-cli --bin mushroomdb --release
      # Exact versions, each named once, in its script (DRIVER_VERSION): a new
      # driver release must not change this gate without a commit that says
      # so, and each script refuses to run against any other version. The
      # scripts print the package spec, so no tracked file spells the
      # package names (scripts/check-names.py).
      - name: install the pinned drivers
        id: drivers
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/bolt-py"
          "$RUNNER_TEMP/bolt-py/bin/pip" install --quiet \
            "$(python tests/bolt/python_compat.py --requirement)"
          npm install --prefix "$RUNNER_TEMP/bolt-js" --no-audit --no-fund \
            "$(node tests/bolt/js_compat.mjs --requirement)"
      - name: official Python driver, twelve scenarios
        timeout-minutes: 10
        run: >-
          bash tests/bolt/run_compat.sh target/release/mushroomdb
          "$RUNNER_TEMP/bolt-py/bin/python" tests/bolt/python_compat.py
      - name: official JavaScript driver, twelve scenarios
        if: ${{ !cancelled() && steps.drivers.outcome == 'success' }}
        timeout-minutes: 10
        env:
          NODE_PATH: ${{ runner.temp }}/bolt-js/node_modules
        run: >-
          bash tests/bolt/run_compat.sh target/release/mushroomdb
          node tests/bolt/js_compat.mjs

  # Every historical snapshot format (V5..V9) must open, migrate, and preserve
  # data, forever. Naming this job separately means a regression says
  # "format-compat" in CI, not the generic "test" job name.
  format-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      # Golden-pin + migration matrix: every historical snapshot format
      # (V5..V9) must open, migrate, and preserve data, forever.
      - run: cargo test -p mushroomdb --test snapshot --test migrate
      # The V9 string table is shared, not copied per column. This asserts the
      # snapshot stays under 2x its property payload; it is #[ignore]'d out of
      # the workspace run because it builds 12k nodes.
      # Measured: 3,744,000 B of properties -> 5,200,624 B snapshot (1.39x);
      # the same store under the per-column tables was 36,784,616 B (9.82x).
      - run: cargo test --release -p mushroomdb --test snapshot -- snapshot_size_is_near_the_property_payload --ignored --nocapture
      # A write that returned survives the process aborting right after it
      # (PF-06a). Process death, not power loss: see the test's module doc.
      - run: cargo test --release -p mushroomdb --test process_abort_durability -- write_survives_process_abort --ignored --nocapture
      - name: Pin typed V11 fixture and upgrade behavior
        run: cargo test -p mushroomdb -j 3 --test snapshot_v11 -- --test-threads=4
      - name: Fetch verified v0.9.2 reader
        shell: bash
        run: |
          set -euo pipefail
          compat="$RUNNER_TEMP/ty13-format-compat"
          mkdir "$compat"
          mkdir "$compat/release" "$compat/diagnostics"
          archive=mushroomdb-v0.9.2-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --silent --show-error --connect-timeout 20 --max-time 180 \
            "https://github.com/MatthewSherlin/mushroomdb/releases/download/v0.9.2/$archive" \
            --output "$compat/$archive"
          printf '%s  %s\n' 4512a5fdaed680068abf967550c76f53da8b7db634b16ca79a03bfa89921b6b8 "$compat/$archive" \
            | sha256sum --check | tee "$compat/diagnostics/archive-checksum.txt"
          tar -xzf "$compat/$archive" -C "$compat/release"
          test -x "$compat/release/mushroomdb"
          "$compat/release/mushroomdb" --version | tee "$compat/diagnostics/release-version.txt"
          test "$(cat "$compat/diagnostics/release-version.txt")" = 'mushroomdb 0.9.2'
          sha256sum "$compat/release/mushroomdb" crates/core-api/tests/fixtures/v11_fixture.bin \
            > "$compat/diagnostics/binary-fixture-sha256.txt"
          git rev-parse HEAD > "$compat/diagnostics/source-head.txt"
          printf 'MUSHROOMDB_V092_BINARY=%s\nMUSHROOMDB_FORMAT_DIAGNOSTICS=%s\n' \
            "$compat/release/mushroomdb" "$compat/diagnostics" >> "$GITHUB_ENV"
      - name: Released reader refuses V11 without touching files
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p mushroomdb -j 3 --test snapshot_v11 -- test_v11_refused_by_09x_binary --ignored --exact --nocapture --test-threads=4 \
            2>&1 | tee "$MUSHROOMDB_FORMAT_DIAGNOSTICS/v11-test.log"
          grep -F 'test test_v11_refused_by_09x_binary ... ok' "$MUSHROOMDB_FORMAT_DIAGNOSTICS/v11-test.log"
          grep -F 'test result: ok. 1 passed;' "$MUSHROOMDB_FORMAT_DIAGNOSTICS/v11-test.log"
      - name: Released reader preserves V9 and snapshot bytes
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p mushroomdb -j 3 --test snapshot_v11 -- test_v9_store_still_opens_under_09x --ignored --exact --nocapture --test-threads=4 \
            2>&1 | tee "$MUSHROOMDB_FORMAT_DIAGNOSTICS/v9-test.log"
          grep -F 'test test_v9_store_still_opens_under_09x ... ok' "$MUSHROOMDB_FORMAT_DIAGNOSTICS/v9-test.log"
          grep -F 'test result: ok. 1 passed;' "$MUSHROOMDB_FORMAT_DIAGNOSTICS/v9-test.log"
      - name: Preserve format compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ty13-format-compat-${{ github.run_id }}
          path: |
            crates/core-api/tests/fixtures/v11_fixture.bin
            ${{ runner.temp }}/ty13-format-compat/diagnostics/
          if-no-files-found: warn

  # The TypeScript client is published by publish.yml on every release and,
  # until 0.6.12, was tested by no workflow at all — a broken build would have
  # been found at release time, after github-release had already gone green.
  # Its suite skips rather than fails when it cannot build a server, so
  # MUSHROOMDB_REQUIRE_SERVER=1 turns those skips into failures here: a job that
  # can skip everything is a job that proves nothing.
  ts-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Build the server the suite drives, so a Rust break fails here and not
      # inside a vitest global-setup message.
      - run: cargo build -p mushroomdb-cli --bin mushroomdb
        working-directory: .
      - run: npm test
        env:
          MUSHROOMDB_REQUIRE_SERVER: "1"
          CARGO: cargo

  # packaging/tests/run.sh is the only test of install.sh and the npm launcher
  # — the two paths most users actually arrive through — and it ran in no
  # workflow. It serves a fake release over localhost and drives both installers
  # against it, so it needs node, python3, curl and tar, but no Rust build.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: bash packaging/tests/run.sh

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    needs: [test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0", components: "clippy, rustfmt" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cargo build -p mushroomdb-cli --bin mushroomdb
      - run: cargo build -p mushroomdb --example insert_edge
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:e2e
        working-directory: ui
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      # Uninstall the runner's preinstalled 1.92.0 first: a --force minimal
      # reinstall over it leaves untracked binaries (bin/cargo-fmt) that later
      # conflict when rust-toolchain.toml's component auto-sync fires on the
      # first rustc invocation from maturin. A clean install with the exact
      # components the toolchain file pins means no sync, no conflict.
      - run: |
          rustup toolchain uninstall 1.92.0 || true
          rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
          rustup default 1.92.0
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -U pip maturin pytest
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest
      - run: .venv/bin/python -m pytest ../../dogfood -q
      # The harness's world-builder tests spawn the binary; a debug build is
      # enough for a 200-node world, and `MUSHROOMDB` points them at it.
      - run: cargo build -p mushroomdb-cli --bin mushroomdb
        working-directory: .
      - run: .venv/bin/python -m pytest ../../benchmarks/agent-tasks/test_agent_harness.py -q
        env:
          MUSHROOMDB: ${{ github.workspace }}/target/debug/mushroomdb
      - run: .venv/bin/python -m pytest ../../benchmarks/test_harness.py -v -q
      - run: .venv/bin/python -m pytest ../../benchmarks/ci/test_compare.py -v -q

  # The two adapter packages under integrations/ test against the binding built
  # from this checkout, not the last PyPI release. Runs only when a PR touches
  # the binding, the engine crates or the adapters.
  test-integrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -qE '^(bindings/python/|crates/|integrations/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: |
          rustup toolchain uninstall 1.92.0 || true
          rustup toolchain install 1.92.0 --profile minimal --component clippy,rustfmt
          rustup default 1.92.0
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip maturin
          (cd bindings/python && ../../.venv/bin/maturin develop)
      - if: steps.gate.outputs.run == 'true'
        run: .venv/bin/pip install -e "integrations/langchain-mushroomdb[test]"
      - if: steps.gate.outputs.run == 'true'
        run: .venv/bin/pytest integrations/langchain-mushroomdb/tests/
      - if: steps.gate.outputs.run == 'true'
        run: .venv/bin/pip install -e "integrations/llama-index-mushroomdb[test]"
      - if: steps.gate.outputs.run == 'true'
        run: .venv/bin/pytest integrations/llama-index-mushroomdb/tests/

  embed:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo test -p mushroomdb-server --features embed-ui
      # The Dockerfile's build, features and all: the image ships this binary.
      - run: cargo build -p mushroomdb-cli --bin mushroomdb --features embed-ui,tls --release
      # The real binary with those features over HTTPS and Bolt over TLS
      # (ledger row 141: a TLS build that installs no crypto provider).
      - run: cargo test -p mushroomdb-cli --features embed-ui,tls --test serve_bolt
      - name: demo + serve + curl index, stats, node
        run: |
          set -euo pipefail
          DB=$(mktemp -d)
          ./target/release/mushroomdb demo "$DB"
          ./target/release/mushroomdb serve "$DB" --addr 127.0.0.1:18080 &
          pid=$!
          trap 'kill $pid' EXIT
          ok=0
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:18080/stats >/dev/null; then ok=1; break; fi
            sleep 0.1
          done
          test "$ok" = 1
          curl -sf http://127.0.0.1:18080/ | grep -qi mushroomdb
          curl -sf http://127.0.0.1:18080/stats | grep -q nodes_live
          curl -sf http://127.0.0.1:18080/node/person-01 | grep -q person-01

  # The release targets the test jobs above do not cover. Each is built here
  # and the binary run through a demo store, a query, three snapshots and a
  # backup, so a tag is not the first time they are compiled or started.
  more-targets:
    name: target-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an Apple Silicon runner: the hosted Intel ones are the
          # runners that sat queued past the 24h cap in v0.1.0.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The binary a release ships: the UI built and embedded, as
      # `release.yml` builds it.
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo build -p mushroomdb-cli --bin mushroomdb --features embed-ui --release --target ${{ matrix.target }}
      - name: demo, query, snapshot, reopen
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/mushroomdb"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          DB="$RUNNER_TEMP/smoke-db"
          "$BIN" --version
          "$BIN" demo "$DB"
          "$BIN" query "$DB" "MATCH (p:Person) RETURN count(p) AS people"
          "$BIN" snapshot "$DB"
          "$BIN" stats "$DB"
          "$BIN" verify "$DB"
          # A write over the snapshot, and a second snapshot over the first:
          # the one that replaces a file the process has mapped.
          "$BIN" query "$DB" "CREATE (n:Person {id: 'smoke', name: 'Smoke Test'})"
          "$BIN" snapshot "$DB" --truncate
          "$BIN" snapshot "$DB" --keep-wal
          "$BIN" query "$DB" "MATCH (p:Person {id: 'smoke'}) RETURN p.name AS name"
          "$BIN" backup "$DB" "$RUNNER_TEMP/smoke-backup"
          "$BIN" stats "$RUNNER_TEMP/smoke-backup"
          # One exchange with the MCP server over stdio.
          # Captured, not piped into grep: under pipefail a grep that has
          # seen enough closes the pipe and fails the step.
          tools=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | "$BIN" mcp "$DB")
          case "$tools" in *'"recall"'*) ;; *) echo "mcp did not list recall" >&2; exit 1 ;; esac
      # The launcher end to end, as a user would have it: the tarball
      # `release.yml` packs, a checksum file, and `npm install` of the packed
      # package, whose postinstall fetches the asset for this platform from a
      # local server. Through npm and not `node install.js`, because npm
      # checks the package's `os` and `cpu` before it runs anything.
      - name: pack as a release does, then install through npm
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          VERSION=$(node -p "require('./packaging/npm/package.json').version")
          NAME="mushroomdb"
          case "$TARGET" in *windows*) NAME="mushroomdb.exe" ;; esac
          # Relative paths for tar, as `release.yml` has them: Git Bash's tar
          # reads `D:\…` as a remote host.
          mkdir -p smoke-rel smoke-stage
          REL="smoke-rel"
          cp "target/${TARGET}/release/${NAME}" "smoke-stage/${NAME}"
          ASSET="mushroomdb-v${VERSION}-${TARGET}.tar.gz"
          tar -C smoke-stage -czf "$REL/$ASSET" "$NAME"
          ( cd "$REL" && { sha256sum --text "$ASSET" 2>/dev/null || shasum -a 256 "$ASSET"; } > SHA256SUMS )
          node -e "
            const http = require('http'), fs = require('fs'), path = require('path');
            const root = process.argv[1];
            http.createServer((req, res) => {
              const f = path.join(root, path.basename(req.url));
              if (!fs.existsSync(f)) { res.statusCode = 404; return res.end(); }
              fs.createReadStream(f).pipe(res);
            }).listen(18099, '127.0.0.1');
          " "$REL" &
          server=$!
          trap 'kill $server' EXIT
          sleep 2
          case "$TARGET" in
            x86_64-apple-darwin) export MUSHROOMDB_FORCE_ARCH=x64 ;;
            x86_64-unknown-linux-musl) export MUSHROOMDB_FORCE_LIBC=musl ;;
          esac
          export MUSHROOMDB_RELEASE_BASE="http://127.0.0.1:18099"
          ( cd packaging/npm && npm pack --pack-destination ../../smoke-rel >/dev/null )
          mkdir smoke-app
          cd smoke-app
          npm init -y >/dev/null
          npm install "../smoke-rel/mushroomdb-${VERSION}.tgz"
          npx --no-install mushroomdb --version
          npx --no-install mushroomdb demo "$RUNNER_TEMP/launcher-db"
          npx --no-install mushroomdb stats "$RUNNER_TEMP/launcher-db"

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build image (no push)
        run: docker build -t mushroomdb:ci .
      - name: run + curl /stats and /
        run: |
          set -euo pipefail
          # G1: non-loopback bind refuses to start without a token, so the
          # container gets one and every authenticated route sends it.
          TOKEN=ci-smoke-token
          AUTH="Authorization: Bearer $TOKEN"
          docker run -d --name mushroomdb-ci -p 18080:8080 -e MUSHROOMDB_TOKEN="$TOKEN" mushroomdb:ci
          trap 'docker logs mushroomdb-ci || true; docker rm -f mushroomdb-ci >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          curl -sf -H "$AUTH" http://127.0.0.1:18080/stats | grep -q nodes_live
          curl -sf -H "$AUTH" http://127.0.0.1:18080/stats | grep -q '"nodes_live":60'
          curl -sf -H "$AUTH" http://127.0.0.1:18080/ | grep -qi mushroomdb
          curl -sf -H "$AUTH" http://127.0.0.1:18080/ | grep -qi '<!doctype html'
          # tokenless request to an authenticated route must be rejected
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/stats)
          test "$code" = 401

  bench:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - name: build + run ci_bench
        run: |
          set -euo pipefail
          bash benchmarks/ci/run.sh --output results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: results.json
      # Two gates, and a change fails only if it fails both.
      #
      # The stored baseline was measured once, on one runner, and the runners
      # differ: on identical code the median ingest has measured 0.56 s and
      # 1.33 s, and the median snapshot write 0.97 s and 1.37 s. Against the
      # baseline alone, a slow runner failed a change that touched no engine
      # code. So a metric past its threshold here is measured again on the
      # base commit — the pull request's base, or main's previous tip — on this
      # same runner, and the change fails only if it is slower than that by
      # the same thresholds. A real regression is slower than its base on any
      # runner; a slow runner is slow for both.
      - name: compare against baseline (baseline from run 34880373108, ubuntu-latest, 2026-09-14)
        id: stored
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 benchmarks/ci/compare.py results.json benchmarks/baselines/ci.json \
            --threshold 0.15
      - name: past the stored baseline — measure the base commit on this runner
        if: steps.stored.outcome == 'failure'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE=$(git rev-parse HEAD^1); fi
          git fetch --no-tags --depth=1 origin "$BASE"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && bash benchmarks/ci/run.sh --output "$GITHUB_WORKSPACE/base.json")
          echo "[bench] this change against $BASE, both measured on this runner:"
          python3 benchmarks/ci/compare.py results.json base.json --threshold 0.15

  # SDK-level MCP handshake: speaks to a real `mushroomdb mcp <db>` process
  # on an empty store — a memory store, so the association tools —
  # over stdio using the official @modelcontextprotocol/sdk client, not a
  # hand-rolled JSON-RPC probe, so a break in the wire protocol or the tool
  # list fails the same way it would for a real assistant host.
  mcp-handshake:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo build -p mushroomdb-cli --bin mushroomdb
      # The CLI and MCP reference pages are generated from this binary. A
      # subcommand or a tool the pages do not have fails here, by name.
      - run: python3 scripts/gen-reference.py --check --binary target/debug/mushroomdb cli mcp-tools
      # The commands the docs show, run against this binary on a demo store.
      - run: python3 scripts/check-doc-examples.py --binary target/debug/mushroomdb docs/site/concepts.md docs/site/vector.md
      - run: npm ci
        working-directory: scripts/mcp-handshake
      - run: |
          set -euo pipefail
          node handshake.mjs \
            --command ../../target/debug/mushroomdb \
            --db "$(mktemp -d)" \
            --expect-version "$(cargo pkgid -p mushroomdb-cli | sed 's/.*[#@]//')" \
            --expect-tools query,explain_association,neighborhood,node_info,node_edges,was_linked,edges_at,what_if,node_history,edge_history,find_similar,pairwise_similar,hybrid_search,remember,recall,upsert_entity,ingest_json,create_rule,stats,schema,analyze,suggest_rules,forget
        working-directory: scripts/mcp-handshake

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Major pinned: a schema change in a new major should fail this job
      # loudly rather than silently pass on a moved goalpost.
      - run: npm i -g @anthropic-ai/claude-code@2
      - run: claude plugin validate packaging/plugin --strict
      - run: bash scripts/render-plugin.sh --check
      # The v0.6.4 claim scrub: no "faster coding" / "fewer tokens" claim in a
      # product-facing file, and no skill telling an agent to call the graph
      # ahead of a search. See scripts/check-claims.sh for why.
      - run: bash scripts/check-claims.sh
      # The names gate, shown failing on what it guards and never printing it.
      - run: bash scripts/tests/test-check-names.sh
      # Every relative link and anchor in the hand-written docs resolves, and
      # every page under docs/site is reachable from its index.
      - run: python3 scripts/check-links.py
      # The link gate, shown failing on what it guards: a page the sidebar
      # omits, and a site page linking a file the published site does not have.
      - run: bash scripts/tests/test-check-links.sh
      # No page the sidebar listed before may go missing from it.
      - run: bash scripts/check-summary-pages.sh
      - run: bash scripts/tests/test-check-summary-pages.sh
      # llms-full.txt is generated from the README and docs/site. Until 0.7 it
      # was regenerated only by a version bump, so it drifted between releases
      # with nothing to say so.
      - run: bash scripts/gen-llms-full.sh --check
      # The reference pages that are generated: the generator's own tests, and
      # the Python page against the stub. The CLI and MCP pages need the
      # binary, and are checked in mcp-handshake, which builds it.
      - run: python3 -m unittest scripts/tests/test_gen_reference.py
      - run: python3 scripts/gen-reference.py --check python-api
      # The check that runs the commands a docs page shows. Its own tests run
      # here; the run against a real binary is in mcp-handshake.
      - run: python3 -m unittest scripts/tests/test_check_doc_examples.py
      # One version, many places. Catches the two shapes that have both
      # already shipped: a package manifest left behind (0.6.9 told readers to
      # install 0.6.8; a v0.6.11 tag would have published a wheel labelled
      # 0.6.10), and an inter-crate pin left behind, which resolves under caret
      # until the minor bumps and then fails every publish in the sequence.
      - run: bash scripts/bump-version.sh --check
      # The gate's own blind spot: until 0.7 it enumerated crates/*/Cargo.toml
      # only, so the 0.6.10 pins in bindings/python were invisible and --check
      # reported OK on a tree that could not publish 0.7.0.
      - run: bash scripts/tests/test-bump-version-scope.sh
      # Ran in no workflow until 0.7 — invoked by hand as "Task 12" of a
      # release plan. It also now refuses a DEFERRED row whose target release
      # has already shipped, which row 36 had done for two tags.
      - run: bash scripts/check-defect-ledger.sh
      # Every #[ignore]d test must be either named in a workflow or listed in
      # scripts/ignored-tests-allowed.txt with a one-line reason.  Catches a
      # test added as #[ignore] with no intent to ever run it.
      - run: bash scripts/ignored-test-census.sh

  # The published site, built exactly as pages.yml builds it. Without this a
  # page that does not render, or a landing-page link to nothing, is found by
  # the deploy on main and not by the pull request that caused it.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          v="$(bash scripts/build-site.sh --mdbook-version)"
          f="mdbook-v${v}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$f" "https://github.com/rust-lang/mdBook/releases/download/v${v}/${f}"
          echo "$(bash scripts/build-site.sh --mdbook-sha256)  $f" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$f" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash scripts/build-site.sh
      # The build, shown failing on what it guards: a page the sidebar omits,
      # a stray file over a page, a dead landing link, a directory not its own.
      - run: bash scripts/tests/test-build-site.sh

name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0", components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --workspace --examples
      - run: cargo test --workspace
      # Compile-only: CI runners are too noisy for timing gates.
      - run: cargo bench --no-run

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    needs: [test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0", components: "clippy, rustfmt" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cargo build -p mushroomdb-cli --bin mushroomdb
      - run: cargo build -p mushroomdb --example insert_edge
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run test:e2e
        working-directory: ui
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      # Plain rustup install (--force resolves component conflicts with the
      # runner's preinstalled toolchain); the repo's rust-toolchain.toml would
      # otherwise trigger a conflicting auto-install when maturin invokes rustc.
      - run: rustup toolchain install 1.92.0 --profile minimal --force && rustup default 1.92.0
        working-directory: .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install -U pip maturin pytest
      - run: .venv/bin/maturin develop
      - run: .venv/bin/pytest
      - run: .venv/bin/python -m pytest ../../dogfood -q
      - run: .venv/bin/python -m pytest ../../benchmarks/test_harness.py -v -q

  embed:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: cargo test -p mushroomdb-server --features embed-ui
      - run: cargo build -p mushroomdb-cli --bin mushroomdb --features embed-ui --release
      - name: demo + serve + curl index, stats, node
        run: |
          set -euo pipefail
          DB=$(mktemp -d)
          ./target/release/mushroomdb demo "$DB"
          ./target/release/mushroomdb serve "$DB" --addr 127.0.0.1:18080 &
          pid=$!
          trap 'kill $pid' EXIT
          ok=0
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:18080/stats >/dev/null; then ok=1; break; fi
            sleep 0.1
          done
          test "$ok" = 1
          curl -sf http://127.0.0.1:18080/ | grep -qi mushroomdb
          curl -sf http://127.0.0.1:18080/stats | grep -q nodes_live
          curl -sf http://127.0.0.1:18080/node/person-01 | grep -q person-01

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build image (no push)
        run: docker build -t mushroomdb:ci .
      - name: run + curl /stats and /
        run: |
          set -euo pipefail
          docker run -d --name mushroomdb-ci -p 18080:8080 mushroomdb:ci
          trap 'docker logs mushroomdb-ci || true; docker rm -f mushroomdb-ci >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:18080/stats >/dev/null; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          curl -sf http://127.0.0.1:18080/stats | grep -q nodes_live
          curl -sf http://127.0.0.1:18080/stats | grep -q '"nodes_live":60'
          curl -sf http://127.0.0.1:18080/ | grep -qi mushroomdb
          curl -sf http://127.0.0.1:18080/ | grep -qi '<!doctype html'

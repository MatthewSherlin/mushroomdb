name: B21 concurrency investigation
# Diagnostic branch only; never a PR/push or release acceptance workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  neutral-writer-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - name: Check diagnostic bookkeeping
        run: python3 scripts/b21-concurrency-diagnostic.py --self-test
      - name: Build immutable sources and measure neutral probes
        env:
          GH_DIAGNOSTIC_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/b21-concurrency-diagnostic.py
          --output "$RUNNER_TEMP/b21-concurrency-diagnostic"
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b21-neutral-writer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/b21-concurrency-diagnostic
          if-no-files-found: error
          retention-days: 14

name: nightly-hardening
# The 0.10.x hardening tests (docs/roadmap/v0.10.x-hardening-spec.md) at case
# counts far above what a pull request runs. A failure files an issue carrying
# proptest's shrunk input, so every defect found here leaves a public record.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  hardening:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: H-1
            test: physical_state_equivalence
            cases_var: H1_CASES
            cases: "2000"
            what: every physical state answers alike
          - id: H-2
            test: query_rewrites
            cases_var: H2_CASES
            cases: "3000"
            what: rewrites of a query do not change its answer
          - id: H-4
            test: time_travel_equals_live
            cases_var: H4_CASES
            cases: "3000"
            what: a past commit answers as the store did then
          - id: H-5
            test: rules_under_snapshots
            cases_var: H5_CASES
            cases: "50000"
            what: competing rules agree across snapshots and reopens
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - name: ${{ matrix.id }}, ${{ matrix.what }}
        run: |
          set -o pipefail
          export ${{ matrix.cases_var }}=${{ matrix.cases }}
          cargo test --release -p sim-harness --test ${{ matrix.test }} 2>&1 | tee run.log
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
          WHAT: ${{ matrix.what }}
        run: |
          {
            echo "The nightly $ID run ($WHAT) failed on \`${GITHUB_SHA}\`: [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo '```'
            grep -A40 -E 'disagrees|differs|minimal failing|panicked' run.log | head -80 || tail -60 run.log
            echo '```'
          } > body.md
          gh issue create --title "nightly $ID: $WHAT — failed ($(date -u +%F))" --body-file body.md

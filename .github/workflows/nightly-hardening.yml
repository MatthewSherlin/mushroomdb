name: nightly-hardening
# The 0.10.x hardening tests (docs/roadmap/v0.10.x-hardening-spec.md) at a case
# count far above what a pull request runs. A failure files an issue carrying
# proptest's shrunk input, so every defect found here leaves a public record.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  h1-physical-states:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Toolchain version comes from rust-toolchain.toml — keep the two in sync.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.92.0
        with: { toolchain: "1.92.0" }
      - name: H-1, every physical state answers alike
        env:
          H1_CASES: "2000"
        run: |
          set -o pipefail
          cargo test --release -p sim-harness --test physical_state_equivalence 2>&1 | tee h1.log
      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The nightly H-1 run failed on \`${GITHUB_SHA}\`: [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo '```'
            grep -A40 -E 'disagrees|minimal failing|panicked' h1.log | head -80 || tail -60 h1.log
            echo '```'
          } > body.md
          gh issue create --title "nightly H-1: physical states disagree ($(date -u +%F))" --body-file body.md

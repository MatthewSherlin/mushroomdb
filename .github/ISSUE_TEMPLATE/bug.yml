name: Bug report
description: Report a reproducible defect in mushroomdb
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check that you are on the latest commit on `main`
        and that the Rust gate (`cargo test --workspace`) passes locally.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` or the binary version string
      placeholder: "e.g. a812d29 or v0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: |
        Minimal steps to reproduce. Prefer a short Rust snippet using `core-api`
        or a sequence of CLI commands. Include the database directory setup if relevant.
      placeholder: |
        ```rust
        let mut db = GraphDb::open(...)?;
        // ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include error messages, panic output, or wrong results.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU arch, Rust toolchain version, RAM
      placeholder: |
        OS: macOS 15.7.3 arm64
        Rust: 1.92.0
        RAM: 24 GiB
    validations:
      required: false

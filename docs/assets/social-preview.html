<!doctype html>
<!-- Source for the GitHub social preview card. Regenerate the PNG with:
     ui/ $ node scripts/render-social-preview.mjs
     (renders this file at 1280x640 @2x -> docs/assets/social-preview.png) -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: #0B0E14;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 72px;
    font-family: "Menlo", "SF Mono", "DejaVu Sans Mono", monospace;
  }
  .mark { width: 300px; height: 300px; flex: none; margin-top: -8px; }
  .text { max-width: 820px; }
  .wordmark {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-size: 96px;
    letter-spacing: 2px;
    color: #EDEBE6;
    line-height: 1;
  }
  .wordmark b { color: #E8A33D; font-weight: 800; }
  .sub {
    margin-top: 34px;
    font-size: 30px;
    line-height: 1.55;
    color: #CFCBC0;
    white-space: nowrap;
  }
  .chips {
    margin-top: 30px;
    font-size: 24px;
    color: #63C7B8;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <img class="mark" src="mark.svg" alt="" />
  <div class="text">
    <div class="wordmark">mushroom<b>db</b></div>
    <div class="sub">The association engine for apps and AI agents.<br/>Edges are declared, not inserted.</div>
    <div class="chips">rules &middot; hybrid search &middot; agent memory &middot; explain()</div>
  </div>
</body>
</html>

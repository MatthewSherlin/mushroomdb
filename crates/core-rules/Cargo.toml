[package]
name = "mushroomdb-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rule evaluation engine for mushroomdb: declarative predicates and trigger logic"

[lib]
name = "core_rules"

[features]
# Exposes counters an integration test in a *different* crate needs to observe
# index work (`hnsw_search_count`). Never enabled by a normal build.
test-hooks = []

[dependencies]
bincode = { workspace = true }
core-storage = { package = "mushroomdb-storage", path = "../core-storage", version = "0.6.5" }
serde = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[package]
name = "mushroomdb-cli"
version = "0.4.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI binary for mushroomdb: start, shell, and server commands"
readme = "README.md"

[lib]
name = "cli"

[[bin]]
name = "mushroomdb"
path = "src/main.rs"

[features]
default = []
embed-ui = ["server/embed-ui"]
tls = ["server/tls"]

[dependencies]
core-api = { package = "mushroomdb", path = "../core-api", version = "0.4.3" }
server = { package = "mushroomdb-server", path = "../server", version = "0.4.3" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
parquet = { version = "59", default-features = false, features = ["arrow"] }
arrow-array = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }

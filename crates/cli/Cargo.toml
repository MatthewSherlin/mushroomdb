[package]
name = "cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "mushroomdb"
path = "src/main.rs"

[features]
default = []
embed-ui = ["server/embed-ui"]

[dependencies]
core-api = { path = "../core-api" }
server = { path = "../server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

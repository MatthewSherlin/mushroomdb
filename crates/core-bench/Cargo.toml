[package]
name = "core-bench"
version = "0.9.2"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
autolib = false

[dependencies]
mushroomdb = { path = "../core-api" }
core-storage = { package = "mushroomdb-storage", path = "../core-storage" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "engine"
harness = false

[lints.rust]
# `mdb_v092`: the concurrency gate's scenario built against the v0.9.2 tag,
# as the gate's same-machine baseline (see benches/shared/concurrency.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mdb_v092)"] }

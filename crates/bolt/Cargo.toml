[package]
name = "mushroomdb-bolt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bolt wire protocol (PackStream v1) for mushroomdb"

[lib]
name = "bolt"

[dependencies]
mushroomdb = { path = "../core-api", version = "0.9.2" }
tokio = { version = "1", features = ["io-util", "time", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "sync", "test-util"] }
tempfile = "3"

[package]
name = "mushroomdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embedded graph database with Cypher queries, rule triggers, and Arrow export"
readme = "../../README.md"

[lib]
name = "core_api"

[dependencies]
core-storage = { package = "mushroomdb-storage", path = "../core-storage", version = "0.4.1" }
core-rules = { package = "mushroomdb-rules", path = "../core-rules", version = "0.4.1" }
core-query = { package = "mushroomdb-query", path = "../core-query", version = "0.4.1" }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
core-storage = { package = "mushroomdb-storage", path = "../core-storage", version = "0.4.1" }
# Path-only (no version): sim-harness is publish=false; a version key makes
# `cargo publish -p mushroomdb` try to resolve it on the index and fail.
sim-harness = { path = "../sim-harness" }
serde_json = { workspace = true }

[package]
name = "mushroomdb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embedded graph database with Cypher queries, rule triggers, and Arrow export"
readme = "../../README.md"

[lib]
name = "mushroomdb"

# Helper process spawned by `tests/multiprocess.rs`.  Gated behind `mp-test` so
# a plain `cargo build` / `cargo test --workspace` never builds it; the
# multi-process suite runs as `cargo test -p mushroomdb --features mp-test`.
[[bin]]
name = "mp_worker"
path = "src/bin/mp_worker.rs"
required-features = ["mp-test"]

[features]
# Enables the `mp_worker` helper binary and, with it, `tests/multiprocess.rs`.
mp-test = []
# Exposes `GraphDb::push_unapplyable_delta_for_test`, which corrupts the
# reader's delta tail so the `Corrupt` arm of the scoped reader is reachable
# from an integration test in a *different* crate (`crates/server/tests`),
# where `#[cfg(test)]` cannot reach. A hook that corrupts a store has no place
# in the shipped surface: never enabled by a normal build. It turns on the rule
# engine's hooks too: `inject_double_ownership_for_test` here calls the engine's.
test-hooks = ["core-rules/test-hooks"]

[dependencies]
core-storage = { package = "mushroomdb-storage", path = "../core-storage", version = "0.9.2" }
core-rules = { package = "mushroomdb-rules", path = "../core-rules", version = "0.9.2" }
core-query = { package = "mushroomdb-query", path = "../core-query", version = "0.9.2" }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
matrixmultiply = { workspace = true }
unicode-normalization = { workspace = true }
# Access keys are stored as blake3 digests (HO-04). Already a direct dependency of
# mushroomdb-extract, so it adds no new crate to the lock.
blake3 = "1"

[target.'cfg(unix)'.dependencies]
# The effective uid, to check who owns keys.json. Already a dependency of
# mushroomdb-storage and mushroomdb-server.
libc = { version = "0.2", default-features = false }

[dev-dependencies]
core-storage = { package = "mushroomdb-storage", path = "../core-storage", version = "0.9.2" }
# `test-hooks` exposes `core_rules::hnsw_insert_count`, which
# `tests/rules.rs::reopening_does_not_rebuild_the_vector_index` uses to assert
# that an open adopts the persisted graph instead of inserting into a new one,
# and `core_rules::hnsw_search_count`, which
# `tests/hnsw_open.rs::clean_open_first_query_is_served_by_the_index` uses to
# assert the first query on a clean open is answered by the persisted graph
# rather than by the (equally correct, but O(n)) brute-force fallback.
core-rules = { package = "mushroomdb-rules", path = "../core-rules", version = "0.9.2", features = [
    "test-hooks",
] }
# Path-only (no version): sim-harness is publish=false; a version key makes
# `cargo publish -p mushroomdb` try to resolve it on the index and fail.
sim-harness = { path = "../sim-harness" }
serde_json = { workspace = true }

[package]
name = "server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
embed-ui = ["dep:include_dir"]

[dependencies]
core-api = { path = "../core-api" }
arrow-bridge = { path = "../arrow-bridge" }
# ws enabled now so Task 5 can add GET /watch without a dep bump.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde_json = { workspace = true }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
include_dir = { version = "0.7", optional = true }

[dev-dependencies]
# oneshot ServiceExt — axum re-exports tower types but not the util trait.
tower = { version = "0.5", default-features = false, features = ["util"] }
arrow-ipc = { version = "59", default-features = false }
arrow-array = { version = "59", default-features = false }
# WS integration: axum oneshot cannot complete an upgrade; real TCP + this client.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

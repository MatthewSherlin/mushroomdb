[package]
name = "mushroomdb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HTTP/WebSocket server and MCP adapter for mushroomdb"

[lib]
name = "server"

[features]
default = []
embed-ui = ["dep:include_dir"]
tls = ["dep:axum-server"]

[dependencies]
core-api = { package = "mushroomdb", path = "../core-api", version = "0.4.5" }
arrow-bridge = { package = "mushroomdb-arrow", path = "../arrow-bridge", version = "0.4.5" }
# ws enabled now so Task 5 can add GET /watch without a dep bump.
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
include_dir = { version = "0.7", optional = true }
# RSS memory metric — already in the transitive tree at 0.2.189; direct dep
# so the cfg(target_os) blocks compile without an indirect version pin.
libc = { version = "0.2", default-features = false }

[dev-dependencies]
# oneshot ServiceExt — axum re-exports tower types but not the util trait.
tower = { version = "0.5", default-features = false, features = ["util"] }
arrow-ipc = { version = "59", default-features = false }
arrow-array = { version = "59", default-features = false }
# WS integration: axum oneshot cannot complete an upgrade; real TCP + this client.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
proptest = { workspace = true }
# TLS integration tests.
tempfile = "3"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Install an explicit crypto provider when both ring and aws-lc-rs are compiled in.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

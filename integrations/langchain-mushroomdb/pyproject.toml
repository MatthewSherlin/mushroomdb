[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-mushroomdb"
version = "0.1.0"
description = "LangChain GraphStore backed by the mushroomdb embedded graph database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
keywords = ["graph", "embedded", "database", "mcp", "agent-memory", "langchain", "knowledge-graph", "mushroomdb"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-community>=0.4",
    "mushroomdb",
]

[project.optional-dependencies]
dev = ["pytest>=7", "maturin"]

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_mushroomdb*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

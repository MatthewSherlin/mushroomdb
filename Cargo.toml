[workspace]
resolver = "2"
members = [
    "crates/core-storage",
    "crates/core-api",
    "crates/sim-harness",
    "crates/core-rules",
    "crates/core-query",
    "crates/arrow-bridge",
    "crates/server",
    "crates/cli",
    "crates/core-bench",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
crc32fast = "1"
proptest = "1"
# Bench-only. Consumed as a dev-dep by core-bench; do not take it as a
# runtime dependency.
criterion = "0.8"

[workspace]
resolver = "2"
members = [
    "crates/core-storage",
    "crates/core-api",
    "crates/sim-harness",
    "crates/core-rules",
    "crates/core-query",
    "crates/arrow-bridge",
    "crates/server",
    "crates/cli",
    "crates/core-bench",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MatthewSherlin/mushroomdb"
rust-version = "1.92.0"
keywords = ["graph", "embedded", "database", "mcp", "agent-memory"]
categories = ["database-implementations", "data-structures"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
crc32fast = "1"
proptest = "1"
zstd = "0.13"
rkyv = "0.8"
memmap2 = "0.9"
# Bench-only. Consumed as a dev-dep by core-bench; do not take it as a
# runtime dependency.
criterion = "0.8"

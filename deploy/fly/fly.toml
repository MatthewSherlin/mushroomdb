# mushroomdb on Fly.io.
#
# Setup:
#   fly launch --no-deploy --copy-config
#   fly volumes create mushroomdb_data --size 10 --region iad
#   fly secrets set MUSHROOMDB_TOKEN=<set-me>
#   fly deploy
#
# `app` must be globally unique on Fly; `fly launch --copy-config` prompts for it.
#
# VOLUME OWNERSHIP: the image runs as uid 65532, not root, and has no shell, so
# it cannot chown its own volume. A new Fly volume is root-owned. If serve exits
# at start with `the data directory is not writable ... uid 65532`, change the
# volume's owner once with a one-off machine on it (same region), then deploy:
#   fly machine run busybox:stable chown -R 65532:65532 /data \
#     --app <app> --region iad --volume mushroomdb_data:/data --rm
# Status: this recipe is confirmed at the release gate by a real Fly deploy; it
# has not been run yet. Full recipe for every platform: docs/site/deployment.md,
# "Volume ownership on managed platforms".

app = "mushroomdb"
primary_region = "iad"

# Seconds between SIGTERM and SIGKILL (default 5, maximum 300). serve drains, snapshots, then flushes the
# backup and deletes its bucket lease; 60 s covers that at the defaults
# (docs/site/deployment.md, "Stopping cleanly, and the grace period").
kill_timeout = 60

[build]
  image = "ghcr.io/matthewsherlin/mushroomdb:latest"

[env]
  # Non-secret settings only. Secrets (never put values here):
  #   fly secrets set MUSHROOMDB_TOKEN=<set-me>
  # Structured logs for the platform log shipper:
  MUSHROOMDB_LOG_FORMAT = "json"
  # Continuous backup (docs/site/deployment.md); the AWS_* credentials go in
  # `fly secrets set`, never here:
  # MUSHROOMDB_BACKUP_S3_URL = "s3://<bucket>/<prefix>"
  # Restore on boot: an empty volume restores the newest backup there before serving.
  # MUSHROOMDB_RESTORE_FROM_S3 = "s3://<bucket>/<prefix>"
  # TODO(HO-14/HO-15): the rest of the backup settings go here. Nothing in this
  # file turns backup on yet.

[processes]
  # Explicit command: no --demo-if-empty, so a production volume is never seeded.
  app = "serve /data --addr 0.0.0.0:8080 --snapshot-every 300"

[[services]]
  processes = ["app"]
  protocol = "tcp"
  internal_port = 8080
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [services.concurrency]
    type = "requests"
    hard_limit = 256
    soft_limit = 200
  [[services.http_checks]]
    interval = "10s"
    timeout = "5s"
    # Fly's maximum: flyctl lowers anything longer to 60 s. A WAL replay or a
    # restore on boot that takes longer leaves the check failing, and the
    # machine unhealthy, until /ready answers (docs/site/deployment.md,
    # "Restoring on boot").
    grace_period = "60s"
    method = "get"
    path = "/ready"

# The Bolt port (7687) is added by HO-15; it is intentionally absent here.

[[mounts]]
  source = "mushroomdb_data"
  destination = "/data"

# SINGLE WRITER - replicas must be 1.
# mushroomdb is single-writer: two machines sharing one store will fail to
# acquire the write lock. Run exactly one machine (`fly scale count 1`).
[deploy]
  strategy = "immediate"    # a rolling deploy cannot work with a single volume

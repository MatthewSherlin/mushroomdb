[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "mushroomdb"
version = "0.4.5"
requires-python = ">=3.10"
description = "Embedded mushroomdb graph database — Python bindings via PyO3"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
keywords = ["graph", "embedded", "database", "mcp", "agent-memory", "hnsw", "association"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/MatthewSherlin/mushroomdb"
Repository = "https://github.com/MatthewSherlin/mushroomdb"
"Bug Tracker" = "https://github.com/MatthewSherlin/mushroomdb/issues"

[tool.maturin]
module-name = "mushroomdb"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]

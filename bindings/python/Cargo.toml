[package]
name = "mushroomdb-python"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for mushroomdb"
publish = false

# Standalone: do not join the repo workspace. Path deps on core-api still
# compile through the root workspace they belong to.
[workspace]

[lib]
name = "mushroomdb"
crate-type = ["cdylib"]

[dependencies]
core-api = { package = "mushroomdb", path = "../../crates/core-api", version = "0.5.0" }
core-storage = { package = "mushroomdb-storage", path = "../../crates/core-storage", version = "0.5.0" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
serde_json = "1"

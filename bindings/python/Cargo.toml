[package]
name = "mushroomdb-python"
version = "0.10.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for mushroomdb"
publish = false

# Standalone: do not join the repo workspace. Path deps on core-api still
# compile through the root workspace they belong to.
[workspace]

[lib]
name = "mushroomdb"
crate-type = ["cdylib"]

[dependencies]
# Imported as `core_api`, the engine crate's old library name, on purpose:
# this crate's own library is `mushroomdb` (it is what Python imports), and a
# crate cannot depend on another under its own name. Everywhere else the
# engine is `mushroomdb`.
core-api = { package = "mushroomdb", path = "../../crates/core-api", version = "0.10.1" }
core-storage = { package = "mushroomdb-storage", path = "../../crates/core-storage", version = "0.10.1" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
serde_json = "1"

[features]
# Exposes `GraphDb._declare_constraint_for_test`, so a Python test can reach the
# errors a unique-constraint declaration raises before Python has an API for it.
# Never enabled in a wheel.
test-hooks = ["core-api/test-hooks"]
